services:
  postgres:
    image: postgres:16-alpine
    container_name: smartbuild-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: smartbuild_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - smartbuild_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smartbuild_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: smartbuild-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_URL: ${DB_URL:-jdbc:postgresql://postgres:5432/smartbuild_db}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-smartbuildpc_jwt_secret_key_minimum_256_bits_length_for_security_compliance}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /app/tmp:mode=0700,uid=10001,gid=10001
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/v3/api-docs > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s

volumes:
  smartbuild_pgdata:
